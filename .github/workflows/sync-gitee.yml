# 把 README 镜像到 Gitee,并把 GitHub 已发布的 release 同步为 Gitee release。
# 边界:Gitee 侧永远只收到 README.md / README.en.md / docs/images(README 渲染所需),
# 不推送任何代码;Gitee 上的 tag 仅作为 release 载体,指向镜像提交而非代码提交。
# 凭据:仓库 secret GITEE_TOKEN(Gitee 私人令牌,勾选 projects 权限),不落代码不入日志。
# 幂等:重复运行只补建 Gitee 缺失的 release;README 无变化时不产生新提交。
name: Sync Gitee

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'README.md'
      - 'README.en.md'
      - 'docs/images/**'
      - '.github/workflows/sync-gitee.yml'
  release:
    types: [published]

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # 文档镜像:从完整检出中仅复制 README 与其引用的图片,组独立提交推送,
      # 保证 Gitee 收不到代码与历史
      - name: Mirror README to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/mirror && mkdir -p /tmp/mirror/docs/images
          cp README.md README.en.md /tmp/mirror/
          cp docs/images/* /tmp/mirror/docs/images/
          cd /tmp/mirror
          git init -q -b master
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add gitee "https://Co2O2:${GITEE_TOKEN}@gitee.com/Co2O2/location.git"
          # 接续 Gitee 已有镜像提交形成线性历史;Gitee 还是空仓库时忽略失败
          git fetch -q gitee master 2>/dev/null && git reset -q --soft FETCH_HEAD || true
          git add -A
          if [ -z "$(git status --porcelain)" ]; then
            echo "README 无变化,跳过推送"
          else
            git commit -q -m "docs: 镜像 README(源 Liuke618/Location@${GITHUB_SHA::7},完整代码与发布见 GitHub)"
            git push -q gitee master
            echo "已推送 README 镜像提交"
          fi

      # Release 同步:遍历 GitHub 已发布的 release,凡 Gitee 缺失即补建并上传附件
      - name: Sync releases to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request


          def fail(msg):
              # 以 ::error:: 输出,成为 check annotation,便于无日志权限时排障
              print('::error::' + msg.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))


          gh_token = os.environ['GH_TOKEN']
          ge_token = os.environ['GITEE_TOKEN']
          gitee_api = 'https://gitee.com/api/v5/repos/Co2O2/location'
          tmpdir = '/tmp/assets'
          os.makedirs(tmpdir, exist_ok=True)


          def gh_fetch(url, accept='application/json'):
              req = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + gh_token,
                  'Accept': accept,
              })
              return urllib.request.urlopen(req, timeout=120)


          def gitee_post(path, fields):
              data = urllib.parse.urlencode(fields).encode()
              req = urllib.request.Request(gitee_api + path, data=data)
              return urllib.request.urlopen(req, timeout=60)


          with gh_fetch('https://api.github.com/repos/'
                        + os.environ['GITHUB_REPOSITORY']
                        + '/releases?per_page=30') as r:
              gh_releases = json.load(r)
          with urllib.request.urlopen(gitee_api + '/releases?access_token='
                                      + ge_token + '&per_page=100', timeout=60) as r:
              gitee_ids = {rel['tag_name']: rel['id'] for rel in json.load(r)}

          failed = []
          for rel in gh_releases:
              if rel['draft'] or rel['tag_name'] in gitee_ids:
                  continue
              tag = rel['tag_name']
              # 先显式建 tag(指向 master;已存在等失败不阻塞,由建 release 暴露真实报错)
              try:
                  gitee_post('/tags', {'access_token': ge_token, 'tag_name': tag,
                                       'ref': 'master'}).read()
                  print(tag + ': 已创建 Gitee tag(指向 master)')
              except Exception as e:
                  print(tag + ': 建 tag 跳过: ' + repr(e))
              try:
                  with gitee_post('/releases', {
                      'access_token': ge_token,
                      'tag_name': tag,
                      'name': rel['name'] or tag,
                      'body': rel['body'] or '',
                      'prerelease': 'true' if rel['prerelease'] else 'false',
                  }) as r:
                      rid = json.load(r)['id']
                  print(tag + ': 已创建 Gitee release id=' + str(rid))
              except urllib.error.HTTPError as e:
                  fail('create ' + tag + ' HTTP ' + str(e.code) + ': '
                       + e.read().decode('utf-8', 'replace')[:500])
                  failed.append(tag)
                  continue
              except Exception as e:
                  fail('create ' + tag + ': ' + repr(e))
                  failed.append(tag)
                  continue
              for asset in rel['assets']:
                  dest = os.path.join(tmpdir, asset['name'])
                  with gh_fetch(asset['url'], accept='application/octet-stream') as src, \
                          open(dest, 'wb') as out:
                      shutil.copyfileobj(src, out)
                  up = subprocess.run([
                      'curl', '-sfS', '-X', 'POST',
                      gitee_api + '/releases/' + str(rid)
                      + '/attach_files?access_token=' + ge_token,
                      '-F', 'file=@' + dest,
                  ], capture_output=True, text=True)
                  if up.returncode != 0:
                      fail('upload ' + asset['name'] + ' for ' + tag + ': '
                           + (up.stderr or up.stdout or 'curl 失败')[:500])
                      failed.append(tag)
                  else:
                      print(tag + ': 附件已上传 ' + asset['name'] + ' (' + dest + ')')
          if failed:
              raise SystemExit('同步失败的 release: ' + ', '.join(sorted(set(failed))))
          print('release 同步完成')
          PY
