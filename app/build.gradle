plugins {
    id "com.android.application"
}

// 从 local.properties 读取高德地图密钥并注入 manifestPlaceholder(键名与 CI 注入方式保持不变)
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def amapApiKey = localProps.getProperty('AMAP_API_KEY', '')
if (amapApiKey.isEmpty()) {
    logger.warn('AMAP_API_KEY 未在 local.properties 中配置,高德地图运行时将无法初始化')
}

// 应用内更新的 release 来源(owner/repo)。刻意不再硬编码上游仓库:上游 APK 与本应用包名不同,
// 装上的是另一个应用而非升级。默认指本 fork,可经 local.properties 或 CI 注入 UPDATE_REPO_SLUG 覆盖
def updateRepoSlug = localProps.getProperty('UPDATE_REPO_SLUG', 'Liuke618/Location')

// 签名凭据从 local.properties 读取(该文件 gitignored)，不再明文写在本文件里;CI 由 secrets 写入同名键
def signKeyAlias = localProps.getProperty('KEY_ALIAS', '')
def signKeyStorePassword = localProps.getProperty('KEY_STORE_PASSWORD', '')
def signKeyPassword = localProps.getProperty('KEY_PASSWORD', '')
if (signKeyAlias.isEmpty() || signKeyStorePassword.isEmpty() || signKeyPassword.isEmpty()) {
    logger.warn('local.properties 缺少签名凭据(KEY_ALIAS/KEY_STORE_PASSWORD/KEY_PASSWORD),'
            + 'assembleDebug/assembleRelease 会在签名阶段失败;CI 由 secrets 注入同名键')
}

android {
    // GradleDependency：SDK 37 已可用；compileSdk 升级需连动 AGP 兼容性评估，属行为变更，本分支锁定 36（分支既定决策）
    //noinspection GradleDependency
    compileSdk = 36
    namespace = 'com.yybb.location'

    signingConfigs {
        debug {
            storeFile file('../keystore/Location.jks')
            storePassword signKeyStorePassword
            keyAlias signKeyAlias
            keyPassword signKeyPassword
        }
        release {
            storeFile file('../keystore/Location.jks')
            storePassword signKeyStorePassword
            keyAlias signKeyAlias
            keyPassword signKeyPassword
        }
    }

    defaultConfig {
        applicationId "com.yybb.location"
        minSdk 31
        // OldTargetApi：targetSdk 37 需先完成新版行为变更适配，属行为变更，本分支锁定 36（分支既定决策）
        //noinspection OldTargetApi
        targetSdk 36
        versionCode 1
        versionName '1.0' // https://semver.org/lang/zh-CN/
        manifestPlaceholders = [AMAP_API_KEY: amapApiKey]
        buildConfigField "String", "UPDATE_REPO_SLUG", "\"${updateRepoSlug}\""
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters "arm64-v8a"
        }
        signingConfig = signingConfigs.release
    }

    androidResources {
        localeFilters += ['zh', 'zh-rCN', 'en', 'en-rUS']
    }

    buildTypes {
        release {
            // Enables code shrinking, obfuscation, and optimization for only
            // your project's release build type.
            minifyEnabled = true

            // Enables resource shrinking, which is performed by the
            // Android Gradle plugin.
            shrinkResources = true

            // Includes the default ProGuard rules files that are packaged with
            // the Android Gradle plugin. To learn more, go to the section about
            // R8 configuration files.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            signingConfig = signingConfigs.release
        }
        debug {
            signingConfig = signingConfigs.debug
        }
    }

    // 启用 BuildConfig（原 buildConfigField 注入 MAPS_API_KEY/MAPS_SAFE_CODE 已随 SDK 迁移改为 manifestPlaceholders:AMAP_API_KEY）
    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            excludes += ['lib/armeabi/**']
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    // lint 基线仅登记 2 条历史 IconLocation 告警（icon_gcoding.webp/welcome.webp 位于无密度目录）：
    // 二者均为第三方位图文件，无法写入 @SuppressLint 或 tools:ignore；其“改目录”建议会改变位图
    // 解码密度、造成渲染行为变化，故按“逐条登记”方式保留；原 BaiduLBS_Android.jar 的
    // TrustAllX509TrustManager 豁免已随百度 jar 迁移删除，不再登记。
    lint {
        baseline = file('lint-baseline.xml')
    }
}

def apkBaseName = "Go_${android.defaultConfig.versionName}_arm64-v8a"

androidComponents {
    // Groovy DSL 需用 onVariants(selector, action) 两参形式(单闭包形式仅 Kotlin DSL 可用)
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set("${apkBaseName}_${variant.buildType}.apk")
        }
    }
}

dependencies {
    // AppCompat 1.8.0 依赖 Lifecycle/SavedState 传递库，这里显式声明 lifecycle-viewmodel 2.11.0 以固定版本
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.14.0'
    // NewerVersionAvailable：okhttp 5.x 为 Kotlin 重写的大版本升级，存在行为差异，暂维持 4.x 稳定线
    //noinspection NewerVersionAvailable
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // 高德 LBS 官方组合包(3dmap 11.3.100 + location 11.3.000 + search 9.8.1 一体),替代百度本地 jar。
    // 不用拆分三件套(3dmap:10.0.600/search:9.7.1/location:11.3.000):实测三者两两重复类冲突
    // (com.amap.apis.utils.core.api.* 三包皆有,且 3dmap 内嵌整个定位 SDK),无法共存编译;
    // 组合包为高德官方去重打包,location 与计划钉死版本一致(迁移 Task 1 报告有验证明细)
    implementation 'com.amap.api:3dmap-location-search:11.3.100_loc11.3.000_sea9.8.1'
    implementation 'com.elvishew:xlog:1.11.1'
    implementation 'io.noties.markwon:core:4.6.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    // 本地 JVM 单测默认使用 android.jar 的 org.json 桩（全部方法抛 not mocked），
    // 引入真实 org.json 构件（仅测试作用域）供 UpdateManagerTest 解析真实 JSON（UpdateManager.parseRelease）
    // NewerVersionAvailable：测试作用域刻意固定版本，与 okhttp 同模式
    //noinspection NewerVersionAvailable
    testImplementation 'org.json:json:20240303'
}
